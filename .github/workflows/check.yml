name: Check

# Runs the same gate as the local pre-commit hook, so pull requests from any machine get it too.
on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Format, lint, types, copy rules and unit tests
              run: bun run check
            - name: Migrations match the schema snapshots
              # drizzle-kit only reads the config here; it never connects to this address.
              env:
                  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
              run: bunx drizzle-kit check
