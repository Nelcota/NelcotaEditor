<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="studio.css" />
        <script src="shell.js"></script>
        <style>
            body {
                background: #fff;
            }
            .stagep {
                background: var(--inspector);
                display: grid;
                justify-items: center;
                padding: 14px 0 8px;
                gap: 8px;
            }
            .stagep .shot {
                height: 352px;
                border-radius: 12px;
            }
            .tp {
                display: flex;
                align-items: center;
                gap: 14px;
                font-size: 13px;
                color: var(--muted);
            }
            .pb {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: var(--fg);
                color: #fff;
                display: grid;
                place-items: center;
            }
            .tl {
                position: relative;
                padding: 12px 16px 6px;
                display: grid;
                gap: 6px;
                border-bottom: 1px solid var(--line);
            }
            .lanep {
                position: relative;
                height: 40px;
            }
            .lanep .strip {
                border-radius: 7px;
                overflow: hidden;
            }
            .chips {
                position: relative;
                height: 24px;
            }
            .chip {
                position: absolute;
                top: 2px;
                bottom: 2px;
                border-radius: 4px;
                background: var(--secondary);
                border: 1px solid var(--line);
            }
            .chip.play {
                background: color-mix(in oklab, var(--primary) 18%, #fff);
                border-color: var(--primary);
            }
            .list {
                flex: 1;
                overflow: hidden;
                padding: 4px 8px;
            }
            .row {
                display: grid;
                grid-template-columns: 44px minmax(0, 1fr);
                align-items: center;
                height: 40px;
                padding: 0 10px;
                border-radius: 8px;
                font-size: 15px;
            }
            .row time {
                font-size: 12.5px;
                color: var(--muted);
            }
            .row.play {
                background: color-mix(in oklab, var(--primary) 9%, #fff);
                box-shadow: inset 3px 0 0 var(--primary);
            }
            .tabs {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                height: 64px;
                border-top: 1px solid var(--line);
                flex: none;
            }
            .tabs span {
                display: grid;
                justify-items: center;
                align-content: center;
                gap: 3px;
                font-size: 12px;
                color: var(--muted);
            }
            .tabs span.on {
                color: var(--fg);
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div class="phone">
            <div class="pbar">
                <button class="btn icon" id="bk"></button>
                <div class="ttl">
                    <b>Perdidos em São Paulo</b><small>Corte 1 de 3 · rascunho salvo</small>
                </div>
                <span class="sp"></span>
                <button class="btn icon sm" id="u"></button>
                <button class="btn primary sm" id="rb"></button>
            </div>
            <div class="stagep">
                <div class="shot">
                    <div class="cap" style="--cap: 19px">SÃO <em>PAULO.</em></div>
                </div>
                <div class="tp">
                    <button class="btn icon sm" id="b5"></button><button class="pb" id="pl"></button
                    ><button class="btn icon sm" id="f5"></button>
                    <span class="num">0:02,8 / 0:21,6</span>
                </div>
            </div>
            <div class="tl" id="tl"></div>
            <div class="list" id="list"></div>
            <div class="tabs" id="tabs"></div>
        </div>
        <script>
            const I = icon;
            bk.innerHTML = I("left", 20);
            u.innerHTML = I("undo");
            rb.innerHTML = I("render", 16) + "Renderizar";
            b5.innerHTML = I("back5");
            f5.innerHTML = I("fwd5");
            pl.innerHTML = I("play", 16);
            const pct = (s) => (s / 21.6) * 100;
            tl.innerHTML = `<div class="lanep">${strip(5, 4)}<span class="trimwin" style="left:0;right:0;box-shadow:none"></span><span class="head-line" style="left:${pct(2.8)}%"></span></div>
                <div class="chips">${CUES.map(([s, e], i) => `<span class="chip ${i === PLAYING ? "play" : ""}" style="left:${pct(s)}%;width:calc(${pct(e - s)}% - 2px)"></span>`).join("")}</div>`;
            list.innerHTML = CUES.slice(1, 6)
                .map(
                    ([s, , t], i) =>
                        `<div class="row ${i + 1 === PLAYING ? "play" : ""}"><time class="num">${clock(s)}</time><span>${t}</span></div>`,
                )
                .join("");
            tabs.innerHTML = `<span class="on">${I("subs", 22)}Legendas</span><span>${I("palette", 22)}Estilo</span><span>${I("scissors", 22)}Trecho</span>`;
        </script>
    </body>
</html>
