<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Conta · direções</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&display=swap"
        />
        <link rel="stylesheet" href="mock.css" />
        <link rel="stylesheet" href="account.css" />
        <script src="icons.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script>
            const q = new URLSearchParams(location.search);
            const D = q.get("d") || "a";
            document.documentElement.dataset.d = "blue";
            if (q.get("p") === "1") document.body.classList.add("phone");
            const ic = (k, c = "i") =>
                `<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
            const mascot = (n, s) => {
                const sheet = n < 16 ? "shapes" : "objects";
                const t = n % 16;
                return `<span style="display:inline-block;width:${s}px;height:${s}px;flex:none;background:url(img/${sheet}.webp) ${(t % 4) * 33.333}% ${Math.floor(t / 4) * 33.333}%/400% 400% no-repeat"></span>`;
            };

            function side() {
                const nav = [
                    ["home", "Início"],
                    ["videos", "Vídeos", 0, 3],
                    ["scissors", "Cortes"],
                    ["chart", "Painel"],
                    ["user", "Conta", 1],
                ]
                    .map(
                        ([i, l, on, n]) =>
                            `<a class="${on ? "on" : ""}">${ic(i)}${l}${n ? `<span class="count">${n}</span>` : ""}</a>`,
                    )
                    .join("");
                return `<aside class="side">
                    <div class="side-top"><span class="logo">${mascot(15, 24)}nelcota</span><span class="icon-btn accent">${ic("bell")}</span><span class="icon-btn accent">${ic("sidebar")}</span></div>
                    <div class="ws"><span class="ws-mark">${ic("add")}</span><div><span class="eyebrow">Novo vídeo</span><strong>Link ou arquivo</strong></div><span class="end">${ic("upload")}</span></div>
                    <nav class="nav">${nav}</nav>
                    <div class="spacer"></div>
                    <div class="wallet">
                        <div class="wallet-head"><div><small>Armazenamento</small><div class="big">1,1<span> GB de 20 GB</span></div></div><span class="acts">${ic("eye", "i i-sm")}${ic("help", "i i-sm")}</span></div>
                        <div class="meter"><div class="meter-row">${ic("film")}Originais<b>920 MB <em>(81%)</em></b></div><div class="bar"><i class="ok" style="width:81%"></i></div></div>
                        <div class="meter"><div class="meter-row">${ic("scissors")}Cortes<b>219 MB <em>(19%)</em></b></div><div class="bar"><i style="width:19%"></i></div></div>
                        <div class="two"><span class="btn">Ver uso</span><span class="btn primary">Gerenciar ${ic("arrow", "i i-sm")}</span></div>
                    </div>
                    <div class="me"><span class="avatar">CD</span>Conta Demo<span class="end">${ic("menu")}</span></div>
                </aside>`;
            }

            const topBar = `<div class="top"><div class="crumbs">Início${ic("right")}<b>Conta</b></div><div class="end"><span class="icon-btn">${ic("sun")}</span></div></div>`;

            const prefs = `
                <div class="pref"><span class="pref-label">${ic("scissors")}Cortes por vídeo</span><div class="stepper"><span>−</span><b>5 cortes</b><span>+</span></div></div>
                <div class="pref"><span class="pref-label">${ic("clock")}Duração dos cortes</span><div class="pills"><span class="pill-opt">Curtos</span><span class="pill-opt">1 minuto</span><span class="pill-opt on">Livre</span></div></div>
                <div class="pref"><span class="pref-label">${ic("translate")}Idioma da transcrição</span><div class="pills"><span class="pill-opt on">Automático</span><span class="pill-opt">Português</span><span class="pill-opt">Inglês</span><span class="pill-opt">Espanhol</span></div></div>
                <p class="saved">${ic("check")}As mudanças salvam sozinhas</p>`;

            const crew = [
                [16, "Faísca", "vídeos recebidos", "3", 25],
                [18, "Tinta", "min transcritos", "28", 100],
                [19, "Brilho", "momentos escolhidos", "12", 43],
                [20, "Brasa", "cortes com legenda", "12", 43],
            ]
                .map(
                    ([m, n, what, v, w]) =>
                        `<div class="meter-item"><div class="top-row">${mascot(m, 22)}${n}<small>${what}</small><b>${v}</b></div><div class="bar"><i style="width:${w}%"></i></div></div>`,
                )
                .join("");

            const A = () => `<div class="wrap">
                <div class="card">
                    <div class="profile">
                        <span class="big-avatar">CD<span class="cam">${ic("pen")}</span></span>
                        <div class="who">
                            <span class="name">Conta Demo<span class="badge-tag">${ic("user")}Conta pessoal</span></span>
                            <span class="email">demo@nelcota.test</span>
                            <div class="chips-row"><span class="soft-chip">5 cortes por vídeo</span><span class="soft-chip">Duração livre</span><span class="soft-chip">Idioma automático</span></div>
                        </div>
                        <div class="statgroup"><div><b>3</b><small>vídeos</small></div><div><b>12</b><small>cortes</small></div><div><b>1,1 GB</b><small>usados</small></div></div>
                    </div>
                    <div class="actions"><span class="btn sm">${ic("pen")}Editar perfil</span><span class="btn sm">${ic("lock")}Trocar senha</span><span class="btn sm">${ic("logout")}Sair</span></div>
                    <div class="cols">
                        <div class="box"><div class="box-head"><h2>${ic("tuning")}Seus cortes</h2><span class="small" style="margin-left:auto">Vale para cada vídeo novo</span></div>${prefs}</div>
                        <div class="box"><div class="box-head"><h2>${ic("chart")}O que a turma já fez</h2><div class="seg"><span class="on">Turma</span><span>Espaço</span></div></div><div class="meter-list">${crew}</div></div>
                    </div>
                </div>
                <div class="danger">${mascot(22, 26)}<div><b>Excluir conta</b><p class="small">Apaga vídeos, cortes e o acesso. Não dá para desfazer.</p></div><span class="btn sm">Excluir conta</span></div>
            </div>`;

            const B = () => `<div class="settings">
                <nav class="inner-nav">
                    <a class="on">${ic("user")}Perfil</a><a>${ic("tuning")}Seus cortes</a><a>${ic("disk")}Uso e espaço</a><a>${ic("lock")}Segurança</a>
                    <span class="sep"></span><a>${ic("logout")}Sair</a><a class="red">${ic("trash")}Excluir conta</a>
                </nav>
                <div style="display:grid;gap:16px;align-content:start">
                    <div><p class="section-title">Perfil</p><p class="small">Como você aparece no Nelcota.</p></div>
                    <div class="rows">
                        <div class="row-item"><span class="k">Foto<small>Aparece na barra lateral</small></span><span class="v"><span class="mini-avatar">CD</span></span><span class="btn sm">Trocar foto</span></div>
                        <div class="row-item"><span class="k">Nome</span><span class="v">Conta Demo</span><span class="btn sm">Editar</span></div>
                        <div class="row-item"><span class="k">Email<small>Usado para entrar</small></span><span class="v">demo@nelcota.test</span><span></span></div>
                        <div class="row-item"><span class="k">Senha</span><span class="v">••••••••</span><span class="btn sm">Trocar senha</span></div>
                    </div>
                    <div style="margin-top:10px"><p class="section-title">Seus cortes</p><p class="small">Brilho segue isto em cada vídeo novo.</p></div>
                    <div class="rows">
                        <div class="row-item"><span class="k">Cortes por vídeo</span><span class="v"></span><div class="stepper"><span>−</span><b>5 cortes</b><span>+</span></div></div>
                        <div class="row-item"><span class="k">Duração dos cortes</span><span class="v"></span><div class="pills"><span class="pill-opt">Curtos</span><span class="pill-opt">1 minuto</span><span class="pill-opt on">Livre</span></div></div>
                    </div>
                </div>
            </div>`;

            const C = () => `<div class="single">
                <div><p class="group-title">Perfil</p><div class="rows">
                    <div class="hero-row"><span class="big-avatar" style="width:56px;height:56px;font-size:18px">CD<span class="cam" style="width:24px;height:24px;border-width:2px">${ic("pen")}</span></span><div><p class="name">Conta Demo</p><p class="small">demo@nelcota.test</p></div><span style="margin-left:auto" class="btn sm">${ic("pen")}Editar perfil</span></div>
                    <div class="row-item compact"><span class="k">Senha<small>Para entrar no Nelcota</small></span><span class="btn sm">Trocar senha</span></div>
                    <div class="row-item compact"><span class="k">Sessão<small>Neste navegador</small></span><span class="btn sm">${ic("logout")}Sair</span></div>
                </div></div>
                <div><p class="group-title">Seus cortes</p><div class="rows">
                    <div class="row-item compact"><span class="k">Cortes por vídeo<small>Já vem escolhido em cada vídeo novo</small></span><div class="stepper" style="width:180px"><span>−</span><b>5</b><span>+</span></div></div>
                    <div class="row-item compact"><span class="k">Duração dos cortes</span><div class="pills"><span class="pill-opt">Curtos</span><span class="pill-opt">1 minuto</span><span class="pill-opt on">Livre</span></div></div>
                    <div class="row-item compact"><span class="k">Idioma da transcrição<small>Deixa a legenda mais precisa</small></span><span class="select-like">Automático${ic("down")}</span></div>
                </div></div>
                <div><p class="group-title">Uso</p><div class="rows">
                    <div class="row-item compact"><span class="k">Espaço<small>1,1 GB de 20 GB</small></span><span style="width:220px" class="bar"><i style="width:6%"></i></span></div>
                    <div class="row-item compact"><span class="k">Vídeos e cortes<small>Faísca trouxe 3 vídeos, Brasa fez 12 cortes</small></span><span class="small">3 · 12</span></div>
                </div></div>
                <div class="danger"><div><b>Excluir conta</b><p class="small">Apaga vídeos, cortes e o acesso. Não dá para desfazer.</p></div><span class="btn sm">Excluir conta</span></div>
            </div>`;

            const tabs = [
                ["home", "Início"],
                ["videos", "Vídeos"],
                ["scissors", "Cortes"],
                ["chart", "Painel"],
                ["user", "Conta", 1],
            ]
                .map(([i, l, on]) => `<a class="${on ? "on" : ""}">${ic(i)}${l}</a>`)
                .join("");
            document.getElementById("root").innerHTML =
                `<div class="app">${side()}<main class="panel">${topBar}<div class="body">${{ a: A, b: B, c: C }[D]()}</div></main></div><nav class="tabbar" style="grid-template-columns:repeat(5,1fr)">${tabs}</nav>`;
        </script>
    </body>
</html>
