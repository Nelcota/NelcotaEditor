<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Suporte · opção</title>
        <link rel="stylesheet" href="option.css" />
    </head>
    <body>
        <div id="root"></div>
        <script>
            const icon = (d) =>
                `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
            const FILM = icon(
                '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/>',
            );
            const CUT = icon(
                '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
            );
            const ARROW = icon('<path d="M5 12h14M12 5l7 7-7 7"/>');
            const UP = icon('<path d="M12 19V5M5 12l7-7 7 7"/>');
            const PLUS = icon('<path d="M12 5v14M5 12h14"/>');
            const CHECK = icon('<path d="M20 6 9 17l-5-5"/>');
            const CLIP = icon(
                '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
            );
            const BACK = icon('<path d="m15 18-6-6 6-6"/>');
            const DOWN = icon('<path d="m6 9 6 6 6-6"/>');
            const SEARCH = icon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>');
            const MAIL = icon(
                '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
            );

            const TICKETS = [
                {
                    n: 1004,
                    s: "O corte saiu sem legenda",
                    t: "Cortes",
                    i: CUT,
                    st: "answered",
                    when: "há 10 min",
                    unread: true,
                },
                {
                    n: 1003,
                    s: "Formato Ranking cortou o final",
                    t: "Editor Oculto",
                    i: FILM,
                    st: "waiting",
                    when: "ontem",
                },
                {
                    n: 1001,
                    s: "Como conecto meu Claude?",
                    t: "Editor Oculto",
                    i: FILM,
                    st: "done",
                    when: "21 de nov",
                },
            ];
            const LABEL = {
                answered: "Respondido",
                waiting: "Aguardando suporte",
                done: "Resolvido",
            };
            const pill = (st) =>
                `<span class="pill ${st}"><span class="dot"></span>${LABEL[st]}</span>`;
            const bar = (trail) => `<div class="bar">${trail}</div>`;
            const head = (
                extra = "",
            ) => `<div class="row" style="justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap">
                <div style="display:grid;gap:6px"><p class="eyebrow">Geral</p><h1>Suporte</h1><p class="lead">Fale com a nossa equipe. As respostas chegam aqui e por e-mail.</p></div>${extra}</div>`;

            const messages = (compact) => `
                <p class="daymark">Hoje</p>
                <div class="bubble me"><span>Gerei 5 cortes do meu podcast e o terceiro saiu sem legenda. Os outros estão normais.</span><span class="meta">13:24</span></div>
                <div class="row" style="align-items:end;gap:8px"><span class="avatar" style="background:var(--brand);color:var(--brand-ink)">EO</span>
                    <div class="bubble them" style="max-width:${compact ? "85%" : "64%"}"><span class="meta" style="font-weight:600;color:var(--foreground)">Equipe Editor Oculto</span><span>Oi, Ana. Já vimos: a fala desse trecho ficou baixa demais para a transcrição. Refizemos o corte com a legenda, ele já está em Meus cortes.</span><span class="meta">13:40</span></div></div>`;

            const topicCards = (dir) => `
                <div style="display:grid;grid-template-columns:${dir === "row" ? "1fr 1fr" : "1fr"};gap:12px">
                    <div class="card row" style="padding:16px;gap:14px;border-color:var(--brand)"><span class="tile lime">${FILM}</span><div style="flex:1"><b>Editor Oculto</b><p class="meta">Formatos Virais, edições, conexão com o Claude.</p></div>${ARROW}</div>
                    <div class="card row" style="padding:16px;gap:14px"><span class="tile">${CUT}</span><div style="flex:1"><b>Cortes</b><p class="meta">Meus cortes, Painel, vídeos que travaram.</p></div>${ARROW}</div>
                </div>`;

            /* A · Caixa de entrada: list beside the open conversation, as in the prototype, refined. */
            const A = {
                thread: () => `${bar("Suporte")}<div class="page">${head(`<span class="btn">${PLUS}Nova conversa</span>`)}
                    <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start">
                        <div style="display:grid;gap:6px">
                            <div class="row meta" style="justify-content:space-between;padding:0 4px 4px"><span>Suas conversas</span><span>3</span></div>
                            ${TICKETS.map(
                                (
                                    t,
                                    i,
                                ) => `<div class="row" style="padding:12px;border-radius:12px;gap:12px;align-items:start;${i === 0 ? "background:var(--card);box-shadow:inset 0 0 0 1px var(--card-border)" : ""}">
                                <span class="tile sm">${t.i}</span><div style="flex:1;min-width:0;display:grid;gap:4px">
                                <div class="row" style="justify-content:space-between"><b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.s}</b>${t.unread ? '<span class="unread"></span>' : ""}</div>
                                <span class="meta">#${t.n} · ${t.t} · ${t.when}</span><span>${pill(t.st)}</span></div></div>`,
                            ).join("")}
                        </div>
                        <div class="card" style="display:grid;grid-template-rows:auto 1fr auto;min-height:440px">
                            <div class="row" style="padding:16px 20px;justify-content:space-between;border-bottom:1px solid var(--border)">
                                <div style="display:grid;gap:2px"><span class="meta">#1004 · Cortes</span><b style="font-size:17px">O corte saiu sem legenda</b></div>
                                <div class="row">${pill("answered")}<span class="btn sm ghost">${CHECK}Resolvido</span></div></div>
                            <div style="display:grid;gap:14px;padding:20px;align-content:end">${messages(false)}</div>
                            <div style="padding:0 16px 16px"><div class="composer"><span>Escreva sua resposta</span><span class="btn icon">${UP}</span></div></div>
                        </div>
                    </div></div>`,
                new: () => `${bar("Suporte <span>›</span> <b>Nova conversa</b>")}<div class="page">${head()}
                    <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start">
                        <div style="display:grid;gap:6px;opacity:.55">${TICKETS.map((t) => `<div class="row" style="padding:12px;gap:12px"><span class="tile sm">${t.i}</span><div style="display:grid"><b style="font-size:14px">${t.s}</b><span class="meta">#${t.n} · ${t.when}</span></div></div>`).join("")}</div>
                        <div class="card" style="padding:24px;display:grid;gap:18px">
                            <div class="row"><span class="tile sm lime">${CHECK}</span><b>Tema: Editor Oculto</b><span class="meta" style="text-decoration:underline">Trocar</span></div>
                            <div class="field"><label>Assunto</label><div class="input" style="border-color:var(--brand)">Ex.: o vídeo editado ficou sem legenda</div></div>
                            <div class="field"><label>Vídeo <span class="muted" style="font-weight:400">(opcional)</span></label><div class="input row" style="justify-content:space-between"><span>Escolha um vídeo</span>${DOWN}</div></div>
                            <div class="field"><label>Mensagem</label><div class="input area">Conte o que aconteceu. Se for sobre um vídeo, diga qual.</div></div>
                            <div><span class="btn">${UP}Iniciar conversa</span></div>
                        </div></div></div>`,
                phone: () => `${bar("Suporte")}<div class="page">${head()}<span class="btn" style="width:100%">${PLUS}Nova conversa</span>
                    <div style="display:grid;gap:4px">${TICKETS.map((t) => `<div class="row" style="padding:12px 4px;gap:12px;align-items:start;border-bottom:1px solid var(--border)"><span class="tile sm">${t.i}</span><div style="flex:1;display:grid;gap:4px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${t.s}</b>${t.unread ? '<span class="unread"></span>' : ""}</div><span class="meta">#${t.n} · ${t.t} · ${t.when}</span><span>${pill(t.st)}</span></div></div>`).join("")}</div></div>`,
            };

            /* B · Central de ajuda: the two areas as doors on top, the conversations as a table below. */
            const B = {
                thread: () => `${bar("Suporte <span>›</span> <b>#1004</b>")}<div class="page" style="max-width:820px">
                    <div class="row meta">${BACK}Suas conversas</div>
                    <div style="display:grid;gap:8px"><div class="row" style="gap:8px"><span class="tile sm">${CUT}</span><span class="meta">#1004 · Cortes · aberta há 1 hora</span></div>
                    <div class="row" style="justify-content:space-between;flex-wrap:wrap"><h1 style="font-size:28px">O corte saiu sem legenda</h1><div class="row">${pill("answered")}<span class="btn sm ghost">${CHECK}Meu problema foi resolvido</span></div></div></div>
                    <div style="display:grid;gap:0;border-left:2px solid var(--border);margin-left:14px;padding-left:22px">
                        <div style="display:grid;gap:6px;padding-bottom:20px;position:relative"><span class="avatar" style="position:absolute;left:-37px;top:0">AT</span><div class="row"><b style="font-size:14px">Você</b><span class="meta">hoje, 13:24</span></div><p>Gerei 5 cortes do meu podcast e o terceiro saiu sem legenda. Os outros estão normais.</p><span class="pill" style="justify-self:start">${CUT} Podcast #12</span></div>
                        <div style="display:grid;gap:6px;padding-bottom:20px;position:relative"><span class="avatar" style="position:absolute;left:-37px;top:0;background:var(--brand);color:var(--brand-ink)">EO</span><div class="row"><b style="font-size:14px">Equipe Editor Oculto</b><span class="meta">hoje, 13:40</span></div><p>Oi, Ana. Já vimos: a fala desse trecho ficou baixa demais para a transcrição. Refizemos o corte com a legenda, ele já está em Meus cortes.</p></div>
                    </div>
                    <div class="card" style="padding:14px;display:grid;gap:10px"><div class="input area" style="height:84px;border:0;padding:0;background:transparent">Responder</div><div class="row" style="justify-content:space-between"><span class="meta">A resposta também chega por e-mail.</span><span class="btn">Enviar resposta</span></div></div>
                    </div>`,
                new: () => `${bar("Suporte")}<div class="page">
                    <div style="display:grid;gap:6px"><p class="eyebrow">Geral</p><h1>Como podemos ajudar?</h1><p class="lead">Escolha a área. A conversa vai direto para quem cuida dela.</p></div>
                    ${topicCards("row")}
                    <div class="row" style="justify-content:space-between;margin-top:8px"><b style="font-size:17px">Suas conversas</b><div class="input" style="height:36px;width:240px;gap:8px">${SEARCH}Buscar</div></div>
                    <div class="card" style="overflow:hidden">
                        <div class="row meta" style="padding:10px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:70px 1fr 140px 170px 90px"><span>Nº</span><span>Assunto</span><span>Área</span><span>Situação</span><span>Atualizada</span></div>
                        ${TICKETS.map((t) => `<div style="padding:12px 16px;display:grid;grid-template-columns:70px 1fr 140px 170px 90px;align-items:center;border-bottom:1px solid var(--border);font-size:14px"><span class="meta" style="font-variant-numeric:tabular-nums">#${t.n}</span><span class="row" style="gap:8px"><b>${t.s}</b>${t.unread ? '<span class="unread"></span>' : ""}</span><span class="row meta" style="gap:6px">${t.i}${t.t}</span><span>${pill(t.st)}</span><span class="meta">${t.when}</span></div>`).join("")}
                    </div></div>`,
                phone: () => `${bar("Suporte")}<div class="page"><div style="display:grid;gap:6px"><p class="eyebrow">Geral</p><h1 style="font-size:28px">Como podemos ajudar?</h1></div>${topicCards("col")}
                    <b style="margin-top:8px">Suas conversas</b><div class="card">${TICKETS.map((t) => `<div style="padding:12px 14px;display:grid;gap:4px;border-bottom:1px solid var(--border)"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${t.s}</b>${t.unread ? '<span class="unread"></span>' : ""}</div><div class="row" style="justify-content:space-between"><span class="meta">#${t.n} · ${t.when}</span>${pill(t.st)}</div></div>`).join("")}</div></div>`,
            };

            /* C · Conversa: one chat column, the conversations in a switcher; starting one is the composer itself. */
            const C = {
                thread: () => `${bar("Suporte")}<div class="page" style="max-width:760px;width:100%;justify-self:center;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 100px)">
                    <div class="row" style="justify-content:space-between">
                        <div class="card row" style="padding:8px 12px;gap:10px"><span class="tile sm">${CUT}</span><div style="display:grid"><b style="font-size:14px">O corte saiu sem legenda</b><span class="meta">#1004 · Cortes</span></div>${DOWN}<span class="unread" style="margin-left:4px"></span></div>
                        <div class="row">${pill("answered")}<span class="btn sm ghost">${PLUS}Nova</span></div></div>
                    <div style="display:grid;gap:14px;align-content:end;padding:12px 0">${messages(false)}
                        <div class="card row" style="padding:12px 14px;gap:12px;justify-self:center"><span class="meta">Resolveu?</span><span class="btn sm">${CHECK}Sim, resolvido</span><span class="btn sm ghost">Ainda não</span></div></div>
                    <div class="composer" style="padding:8px 8px 8px 16px"><span>Responder à equipe</span><span class="tile sm" style="background:transparent;color:var(--muted-foreground)">${CLIP}</span><span class="btn icon">${UP}</span></div>
                    </div>`,
                new: () => `${bar("Suporte <span>›</span> <b>Nova conversa</b>")}<div class="page" style="max-width:760px;width:100%;justify-self:center;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 100px)">
                    <div style="display:grid;gap:6px"><p class="eyebrow">Nova conversa</p><h1 style="font-size:28px">Conte o que está acontecendo</h1><p class="lead">A equipe responde aqui e avisa por e-mail.</p></div>
                    <div></div>
                    <div class="card" style="padding:14px;display:grid;gap:12px">
                        <div class="row" style="gap:8px;flex-wrap:wrap"><span class="meta">Sobre</span><span class="chip on">${FILM}Editor Oculto</span><span class="chip">${CUT}Cortes</span><span class="chip">${CLIP}Anexar vídeo</span></div>
                        <div class="input" style="border:0;padding:0;height:auto;font-weight:600;color:var(--foreground);background:transparent">Assunto: o vídeo editado ficou sem legenda</div>
                        <div class="sep"></div>
                        <div class="input area" style="border:0;padding:0;height:90px;background:transparent">Explique com detalhes. Se for sobre um vídeo, anexe ele acima.</div>
                        <div class="row" style="justify-content:space-between"><span class="row meta" style="gap:6px">${MAIL}Resposta também por e-mail</span><span class="btn">${UP}Iniciar conversa</span></div>
                    </div></div>`,
                phone: () => `${bar("Suporte")}<div class="page" style="grid-template-rows:auto 1fr auto;min-height:calc(100vh - 52px)">
                    <div class="card row" style="padding:8px 12px;gap:10px"><span class="tile sm">${CUT}</span><div style="display:grid;flex:1"><b style="font-size:14px">O corte saiu sem legenda</b><span class="meta">#1004 · Respondido</span></div>${DOWN}</div>
                    <div style="display:grid;gap:14px;align-content:end">${messages(true)}</div>
                    <div class="composer"><span>Responder</span><span class="btn icon">${UP}</span></div></div>`,
            };

            const params = new URLSearchParams(location.search);
            // Only known options and views are rendered; the query string picks among them.
            const OPTIONS = new Map([
                ["a", A],
                ["b", B],
                ["c", C],
            ]);
            const VIEWS = new Set(["thread", "new", "phone"]);
            const option = OPTIONS.get(params.get("o"));
            const view = params.get("v");

            if (option === undefined || VIEWS.has(view) === false) {
                throw new Error("Use ?o=a|b|c&v=thread|new|phone");
            }

            if (view === "phone") {
                document.body.classList.add("is-phone");
            }

            document.getElementById("root").innerHTML =
                `<div class="panel">${option[view]()}</div>`;
        </script>
    </body>
</html>
