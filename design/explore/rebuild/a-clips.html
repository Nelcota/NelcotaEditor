<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>A · Mesa · cortes</title>
        <link rel="stylesheet" href="rebuild.css" />
        <link rel="stylesheet" href="a.css" />
        <style>
            .app {
                grid-template-columns: 64px minmax(0, 1fr);
            }
            .clip-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
            }
        </style>
    </head>
    <body data-guides="centre@32:ícones; text@96:texto; trail@1408:fim">
        <div class="app">
            <nav class="rail">
                <span class="mascot brand"></span>
                <a aria-label="Vídeos"><span data-i="videos"></span></a>
                <a class="on" aria-label="Cortes"><span data-i="scissors"></span></a>
                <a aria-label="Painel"><span data-i="chart"></span></a>
                <span class="grow"></span>
                <a aria-label="Admin"><span data-i="shield"></span></a>
                <a aria-label="Tema"><span data-i="moon"></span></a>
                <span class="avatar"></span>
            </nav>
            <main class="detail wide">
                <header class="detail-head">
                    <div class="grow">
                        <h2>Cortes</h2>
                        <p class="meta muted">8 cortes prontos de 3 vídeos</p>
                    </div>
                    <div class="field" style="width: 280px">
                        <span data-i="search"></span>Buscar corte<span class="kbd">/</span>
                    </div>
                </header>
                <div class="filters">
                    <span
                        class="btn sm"
                        style="background: var(--ink); color: #fff; border-color: transparent"
                        >Todos os vídeos</span
                    >
                    <span class="btn sm"
                        ><span
                            class="mascot"
                            style="width: 18px; height: 18px; background-position: 66.67% 33.33%"
                        ></span
                        >URSO</span
                    >
                    <span class="btn sm"
                        ><span
                            class="mascot"
                            style="width: 18px; height: 18px; background-position: 0 0"
                        ></span
                        >VW ID4</span
                    >
                    <span class="btn sm"
                        ><span
                            class="mascot"
                            style="width: 18px; height: 18px; background-position: 33.33% 66.67%"
                        ></span
                        >CARIANI</span
                    >
                    <span class="grow"></span>
                    <div class="segmented">
                        <span>Recentes</span><span class="on">Maior nota</span>
                    </div>
                </div>
                <div class="clip-grid" id="grid"></div>
            </main>
        </div>
        <script src="icons.js"></script>
        <script src="clips-data.js"></script>
        <script>
            renderClips("#grid", 8, true);
        </script>
        <script src="guides.js"></script>
    </body>
</html>
