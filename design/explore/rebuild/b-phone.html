<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>B · Topo · celular</title>
        <link rel="stylesheet" href="rebuild.css" />
        <link rel="stylesheet" href="b.css" />
        <link rel="stylesheet" href="phone.css" />
        <style>
            .video-card {
                gap: 10px;
            }
        </style>
    </head>
    <body data-guides="text@16:margem; trail@374:margem">
        <header class="p-top" style="border-bottom: 1px solid var(--line); padding-right: 16px">
            <span class="brand" style="margin: 0"><span class="mascot"></span>Nelcota</span>
            <span class="grow"></span>
            <span class="icon-btn sm"><span data-i="search"></span></span>
            <span class="avatar"></span>
        </header>
        <div class="p-body" style="padding-top: 20px; gap: 20px">
            <div class="row">
                <div class="grow">
                    <h1 style="font-size: 24px; font-weight: 600">Vídeos</h1>
                    <p class="xs muted">7 vídeos · 15 cortes prontos</p>
                </div>
                <span class="btn sm"><span data-i="sort"></span>Recentes</span>
            </div>
            <article class="video-card">
                <div class="thumb" style="background-image: url(img/v1.jpg)">
                    <span class="pill ok">3 cortes</span
                    ><span class="badge-on-media" style="right: 10px; bottom: 10px">13:00</span>
                </div>
                <div class="row gap-12" style="align-items: start">
                    <span class="mascot" style="background-position: 0 0"></span>
                    <div class="grow">
                        <p class="title">PRIMEIRO ROLE DE VW ID4</p>
                        <p class="xs muted">YouTube · 20/11/2026</p>
                    </div>
                </div>
            </article>
            <article class="video-card">
                <div class="thumb" style="background-image: url(img/v2.jpg)">
                    <span class="pill ok">3 cortes</span
                    ><span class="badge-on-media" style="right: 10px; bottom: 10px">20:25</span>
                </div>
                <div class="row gap-12" style="align-items: start">
                    <span class="mascot" style="background-position: 66.67% 33.33%"></span>
                    <div class="grow">
                        <p class="title">ESSA HISTÓRIA DA URSO ESTÁ INDO LONGE DE MAIS</p>
                        <p class="xs muted">YouTube · 19/11/2026</p>
                    </div>
                </div>
            </article>
        </div>
        <nav class="tabbar">
            <span class="on"><span data-i="videos"></span>Vídeos</span>
            <span><span data-i="scissors"></span>Cortes</span>
            <span
                ><span class="fab"><span data-i="add"></span></span
            ></span>
            <span><span data-i="chart"></span>Painel</span>
        </nav>
        <script src="icons.js"></script>
        <script src="guides.js"></script>
    </body>
</html>
