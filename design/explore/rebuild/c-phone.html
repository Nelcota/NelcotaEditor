<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>C · Cortes primeiro · celular</title>
        <link rel="stylesheet" href="rebuild.css" />
        <link rel="stylesheet" href="c.css" />
        <link rel="stylesheet" href="phone.css" />
        <style>
            .shelf-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
            body {
                background: var(--surface);
            }
        </style>
    </head>
    <body data-guides="text@16:margem; trail@374:margem">
        <header class="p-top" style="padding-right: 16px">
            <span
                class="mascot"
                style="width: 28px; height: 28px; background-position: 100% 100%"
            ></span>
            <h1 class="grow">Cortes</h1>
            <span class="icon-btn sm"><span data-i="search"></span></span>
            <span class="avatar"></span>
        </header>
        <div class="p-body" style="gap: 14px">
            <div class="pills"><span>Recentes</span><span class="on">Maior nota</span></div>
            <div class="shelf-head">
                <span class="mascot" style="background-position: 66.67% 33.33%"></span>
                <div class="grow">
                    <p class="title clamp-1">ESSA HISTÓRIA DA URSO ESTÁ INDO...</p>
                    <p class="xs muted">3 cortes · 20:25</p>
                </div>
                <span data-i="right"></span>
            </div>
            <div class="shelf-row" id="s1"></div>
        </div>
        <nav class="tabbar">
            <span class="on"><span data-i="scissors"></span>Cortes</span>
            <span><span data-i="videos"></span>Vídeos</span>
            <span
                ><span class="fab"><span data-i="add"></span></span
            ></span>
            <span><span data-i="chart"></span>Painel</span>
        </nav>
        <script src="icons.js"></script>
        <script src="clips-data.js"></script>
        <script>
            var host = document.querySelector("#s1");
            [CLIPS[0], CLIPS[1], CLIPS[6], CLIPS[2]].forEach(function (c) {
                var el = document.createElement("article");
                el.className = "clip-card";
                el.innerHTML =
                    '<div class="vertical" style="background-image:url(img/' +
                    c.img +
                    ')"><p class="cap">' +
                    c.cap +
                    "</p>" +
                    '<span class="score-badge"><span class="mascot obj" style="width:16px;height:16px;background-position:66.67% 100%"></span>' +
                    c.s +
                    "</span>" +
                    '<span class="badge-on-media" style="right:8px;bottom:8px">' +
                    c.d +
                    "</span></div>" +
                    '<p class="title clamp-2">' +
                    c.t +
                    "</p>";
                host.appendChild(el);
            });
        </script>
        <script src="guides.js"></script>
    </body>
</html>
