name: nelcota-production

# Deployed by Dokploy as a Compose service; its environment settings fill the ${...} values and
# its domain settings route the web service through Traefik. No database or Whisper port is
# published: Docker would open it past the firewall.

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    postgres:
        image: postgres:18.7-alpine
        # Slow queries are logged without their bound values, which hold emails and tokens.
        command:
            [
                "postgres",
                "-c",
                "log_min_duration_statement=500",
                "-c",
                "log_parameter_max_length=0",
                "-c",
                "log_parameter_max_length_on_error=0",
            ]
        environment:
            POSTGRES_USER: nelcota
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
            POSTGRES_DB: nelcota
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nelcota -d nelcota"]
            interval: 5s
            timeout: 5s
            retries: 30
        logging: *logging
        restart: unless-stopped

    migrate:
        build:
            context: .
            target: migrate
        environment:
            MIGRATION_DATABASE_URL: postgresql://nelcota:${POSTGRES_PASSWORD:?}@postgres:5432/nelcota
            APP_DATABASE_USER: nelcota_app
            APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?}
        depends_on:
            postgres:
                condition: service_healthy
        logging: *logging
        restart: "no"

    web:
        build:
            context: .
            target: web
        environment:
            DATABASE_URL: postgresql://nelcota_app:${APP_DATABASE_PASSWORD:?}@postgres:5432/nelcota
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
            # Cloudflare sits in front; without it every visitor would share Traefik's address and
            # one sign-in rate limit.
            TRUSTED_PROXY_IP_HEADER: cf-connecting-ip
            TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
            STORAGE_DIR: /app/storage
            STORAGE_DRIVER: r2
            R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
            R2_BUCKET: ${R2_BUCKET:?}
            # Required by the shared settings; only the worker calls Whisper.
            WHISPER_URL: http://whisper:8000
            WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
            STORAGE_QUOTA_GIGABYTES: ${STORAGE_QUOTA_GIGABYTES:-20}
        expose:
            - "3000"
        # The slim Bun image has no curl or wget; Bun's fetch exits non-zero on a 503 or no answer.
        # /health queries through the same database pool as the app, so a busy pool can make it
        # slow or fail for a moment. Once the container is unhealthy, Traefik stops routing to it and
        # every visitor gets an error, so it takes five failures in a row (over a minute) to get
        # there, not one load spike.
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "const response = await fetch('http://localhost:3000/health', { signal: AbortSignal.timeout(8000) }); process.exit(Number(response.status !== 200))",
                ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 60s
        depends_on:
            migrate:
                condition: service_completed_successfully
        logging: *logging
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: Dockerfile.worker
        # Only what the worker reads: it handles files from the internet and must not hold the
        # app's secrets (BETTER_AUTH_SECRET, Turnstile).
        environment:
            DATABASE_URL: postgresql://nelcota_app:${APP_DATABASE_PASSWORD:?}@postgres:5432/nelcota
            STORAGE_DIR: /app/storage
            WORK_DIR: /app/work
            STORAGE_DRIVER: r2
            R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
            R2_BUCKET: ${R2_BUCKET:?}
            WHISPER_URL: http://whisper:8000
            WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
            WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
            DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
            # Only the worker sends email; the web server queues it.
            RESEND_API_KEY: ${RESEND_API_KEY:?}
            EMAIL_FROM: ${EMAIL_FROM:-Nelcota <nao-responda@tela.nelcota.com>}
            STORAGE_QUOTA_GIGABYTES: ${STORAGE_QUOTA_GIGABYTES:-20}
            # One video at a time: ffmpeg and Whisper share the server's 6 cores.
            WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
            FFMPEG_CPU_BUDGET: ${FFMPEG_CPU_BUDGET:-}
            CLIP_RENDER_CONCURRENCY: ${CLIP_RENDER_CONCURRENCY:-}
            CLIP_RENDER_THREADS: ${CLIP_RENDER_THREADS:-}
            CLIP_RENDER_MAX_FPS: ${CLIP_RENDER_MAX_FPS:-}
            TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY:-3}
            # YouTube asks the server's datacenter address to sign in; see .env.example.
            YOUTUBE_COOKIES_BASE64: ${YOUTUBE_COOKIES_BASE64:-}
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        volumes:
            - worker-work:/app/work
        depends_on:
            migrate:
                condition: service_completed_successfully
            whisper:
                condition: service_started
        logging: *logging
        restart: unless-stopped

    whisper:
        # Same pinned image as development.
        image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
        environment:
            # 3 model workers x 2 threads match the server's 6 cores (see docker-compose.yml).
            WHISPER__COMPUTE_TYPE: int8
            WHISPER__NUM_WORKERS: ${WHISPER__NUM_WORKERS:-3}
            WHISPER__CPU_THREADS: ${WHISPER__CPU_THREADS:-2}
            WHISPER__USE_BATCHED_MODE: ${WHISPER__USE_BATCHED_MODE:-false}
        volumes:
            - whisper-models:/home/ubuntu/.cache/huggingface/hub
        logging: *logging
        restart: unless-stopped

volumes:
    postgres-data:
    whisper-models:
    worker-work:
