name: nelcota

services:
    postgres:
        image: postgres:18.7-alpine
        environment:
            POSTGRES_USER: nelcota
            POSTGRES_PASSWORD: nelcota
            POSTGRES_DB: nelcota
        ports:
            # 5433 is a common pick for a second local Postgres and was already taken on a dev machine.
            - "127.0.0.1:5436:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nelcota -d nelcota"]
            interval: 2s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    whisper:
        # Pinned by digest: speaches only publishes moving tags.
        image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
        environment:
            # CPU tuning measured on 8 cores: 4 model workers x 2 threads, fed 3 chunks at once by
            # the worker, transcribed 10 minutes of audio in 51s (165s with the defaults).
            # Keep workers x threads close to the number of CPU cores.
            WHISPER__COMPUTE_TYPE: int8
            WHISPER__NUM_WORKERS: ${WHISPER__NUM_WORKERS:-4}
            WHISPER__CPU_THREADS: ${WHISPER__CPU_THREADS:-2}
            WHISPER__USE_BATCHED_MODE: ${WHISPER__USE_BATCHED_MODE:-false}
        ports:
            - "127.0.0.1:8000:8000"
        volumes:
            - whisper-models:/home/ubuntu/.cache/huggingface/hub
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: Dockerfile.worker
        # Only what the worker reads, never the whole .env: it handles files from the internet and
        # must not hold the app's secrets (BETTER_AUTH_SECRET, Turnstile). Values come from .env.
        environment:
            DATABASE_URL: postgresql://nelcota:nelcota@postgres:5432/nelcota
            STORAGE_DIR: /app/storage
            WORK_DIR: /app/work
            STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
            R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
            R2_BUCKET: ${R2_BUCKET:-}
            WHISPER_URL: http://whisper:8000
            WHISPER_MODEL: ${WHISPER_MODEL}
            WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
            DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
            # Only the worker sends email; the web server queues it.
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            EMAIL_FROM: ${EMAIL_FROM:-Nelcota <nao-responda@tela.nelcota.com>}
            STORAGE_QUOTA_GIGABYTES: ${STORAGE_QUOTA_GIGABYTES:-20}
            WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
            FFMPEG_CPU_BUDGET: ${FFMPEG_CPU_BUDGET:-}
            CLIP_RENDER_CONCURRENCY: ${CLIP_RENDER_CONCURRENCY:-}
            CLIP_RENDER_THREADS: ${CLIP_RENDER_THREADS:-}
            CLIP_RENDER_MAX_FPS: ${CLIP_RENDER_MAX_FPS:-}
            TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY:-3}
            YOUTUBE_COOKIES_BASE64: ${YOUTUBE_COOKIES_BASE64:-}
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./storage:/app/storage
            # Scratch space for downloads and renders; wiped when the worker starts.
            - worker-work:/app/work
            # Mounted so code changes only need `bun run worker:restart`, not a rebuild.
            - ./src:/app/src:ro
            - ./scripts/worker.ts:/app/scripts/worker.ts:ro
        depends_on:
            postgres:
                condition: service_healthy
            whisper:
                condition: service_started
        restart: unless-stopped

volumes:
    postgres-data:
    whisper-models:
    worker-work:
